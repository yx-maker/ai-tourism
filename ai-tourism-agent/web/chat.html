<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AI 旅游规划助手</title>
<style>
  :root {
    /* ---- 极简科技（与前端 3001 同一套设计语言）---- */
    --bg: #08090A;              /* 近黑底 */
    --surface: #111214;         /* 卡片面 */
    --panel: #15171A;           /* 抬高一层 */
    --line: rgba(255, 255, 255, 0.07);        /* 发丝描边 */
    --line-strong: rgba(255, 255, 255, 0.13);

    --t1: #ECEDEF;              /* 主文字 ≈15:1 */
    --t2: #A1A7B0;              /* 次要 ≈7.6:1 */
    --t3: #8A9099;              /* 三级 ≈5.7:1 */
    --t4: #7A808A;              /* 元信息 ≈4.7:1 */

    --accent: #22D3EE;          /* 唯一点缀色：仅用于主按钮/激活/关键数据 */
    --accent-text: #67E8F9;     /* 深底上的文字安全青 */
    --accent-dim: rgba(34, 211, 238, 0.12);

    --r-sm: 8px; --r-md: 10px; --r-lg: 13px; --r-pill: 999px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, textarea, input { font-family: inherit; touch-action: manipulation; }
  html, body { height: 100%; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  body {
    font-family: var(--font);
    color: var(--t1);
    background-color: var(--bg);
    /* 极淡网格：科技底噪（与前端一致的克制作法） */
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
    background-size: 56px 56px;
    background-attachment: fixed;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .skip-link {
    position: absolute; left: 12px; top: -56px; z-index: 50;
    background: var(--accent); color: #08090A; padding: 9px 16px;
    border-radius: var(--r-sm); font-size: 14px; font-weight: 600;
    transition: top .18s var(--ease);
  }
  .skip-link:focus { top: 12px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------------- 顶栏：中性面 + 发丝分隔 ---------------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px;
    background: rgba(12, 13, 15, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0; z-index: 10;
  }
  header .logo {
    width: 38px; height: 38px; border-radius: var(--r-md); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #08090A;
  }
  header .logo svg { width: 22px; height: 22px; }
  header .titles { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  header h1 { font-size: 16px; font-weight: 650; letter-spacing: .2px; color: var(--t1); }
  header .sub { font-size: 12px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .status {
    font-size: 12px; padding: 5px 11px; border-radius: var(--r-pill);
    background: var(--surface); border: 1px solid var(--line);
    color: var(--t2); display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #6B7280; flex-shrink: 0; }
  .status .dot.on { background: #34D399; box-shadow: 0 0 6px rgba(52, 211, 153, .6); }

  .icon-btn {
    width: 40px; height: 40px; border-radius: var(--r-md);
    border: 1px solid var(--line); background: var(--surface); color: var(--t2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:hover { background: var(--panel); color: var(--t1); border-color: var(--line-strong); }
  .icon-btn:active { transform: scale(.94); }

  /* ---------------- 快捷提问 ---------------- */
  #chips {
    display: flex; gap: 8px; padding: 14px 24px;
    overflow-x: auto; scrollbar-width: thin;
    background: rgba(12, 13, 15, 0.5);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0; -webkit-overflow-scrolling: touch;
  }
  #chips::-webkit-scrollbar { height: 6px; }
  #chips::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 999px; }
  .chip {
    white-space: nowrap; font-size: 13px; padding: 9px 15px; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: transparent; color: var(--t2);
    cursor: pointer; line-height: 1.3; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  }
  .chip svg { width: 14px; height: 14px; flex-shrink: 0; }
  .chip:hover { background: var(--accent-dim); color: var(--accent-text); border-color: rgba(34, 211, 238, 0.3); }
  .chip:active { transform: translateY(1px); }

  /* ---------------- 对话区（留白放大） ---------------- */
  #chat { flex: 1; overflow-y: auto; padding: 26px 24px; scroll-behavior: smooth; }
  .msg { display: flex; margin-bottom: 22px; gap: 12px; animation: rise .24s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .msg .avatar {
    width: 36px; height: 36px; border-radius: var(--r-md); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .msg .avatar svg { width: 20px; height: 20px; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--surface); border: 1px solid var(--line); color: var(--t2); }
  .msg.bot .avatar { background: var(--accent-dim); color: var(--accent-text); }

  .bubble {
    max-width: 74%; padding: 14px 17px; border-radius: var(--r-lg);
    font-size: 14.5px; line-height: 1.75; overflow-wrap: break-word; word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--accent); color: #08090A; font-weight: 500;
    border-bottom-right-radius: 4px; white-space: pre-wrap;
  }
  .msg.bot .bubble {
    background: var(--surface); border: 1px solid var(--line);
    border-bottom-left-radius: 4px; color: var(--t1);
  }
  .bubble h3 { font-size: 15.5px; margin: 13px 0 6px; color: var(--t1); font-weight: 650; }
  .bubble h3:first-child { margin-top: 0; }
  .bubble h4 { font-size: 14px; margin: 11px 0 4px; color: var(--t2); font-weight: 650; }
  .bubble table { border-collapse: collapse; margin: 11px 0; width: 100%; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .bubble th { background: var(--panel); color: var(--t2); font-weight: 600; }
  .bubble ul { margin: 4px 0 8px 18px; }
  .bubble li { margin: 4px 0; }
  /* 关键数据（价格等）用唯一点缀色突出 */
  .bubble strong { color: var(--accent-text); font-weight: 650; }
  .bubble code { background: var(--panel); padding: 1px 6px; border-radius: 5px; font-size: 13px; }

  .typing { display: inline-flex; gap: 6px; padding: 8px 4px; align-items: center; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .45; animation: blink 1.3s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .28; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }

  /* ---------------- 输入区 ---------------- */
  footer {
    padding: 16px 24px calc(18px + env(safe-area-inset-bottom));
    background: rgba(12, 13, 15, 0.88);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); flex-shrink: 0;
  }
  .inputRow { display: flex; gap: 10px; max-width: 880px; margin: 0 auto; align-items: flex-end; }
  .inputWrap { flex: 1; }
  textarea {
    width: 100%; resize: none; border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; font-size: 14.5px; line-height: 1.55; color: var(--t1);
    background: var(--surface); outline: none; height: 48px; max-height: 140px;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea::placeholder { color: var(--t4); }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.13); }

  #sendBtn {
    width: 48px; height: 48px; flex-shrink: 0; border: none; cursor: pointer;
    border-radius: var(--r-md); background: var(--accent); color: #08090A;
    display: flex; align-items: center; justify-content: center;
    transition: filter .15s var(--ease), transform .12s var(--ease);
  }
  #sendBtn svg { width: 20px; height: 20px; }
  #sendBtn:hover { filter: brightness(1.08); }
  #sendBtn:active { transform: scale(.94); }
  #sendBtn:disabled { background: var(--panel); color: var(--t4); cursor: not-allowed; filter: none; }

  .hint { text-align: center; font-size: 12px; color: var(--t4); margin-top: 12px; max-width: 880px; margin-left: auto; margin-right: auto; }

  /* ---------------- 响应式 ---------------- */
  @media (max-width: 640px) {
    header { padding: 13px 16px; }
    header .sub { display: none; }
    #chips { padding: 12px 16px; }
    #chat { padding: 20px 16px; }
    .bubble { max-width: 85%; font-size: 14px; }
    footer { padding: 13px 16px calc(16px + env(safe-area-inset-bottom)); }
  }

  @media (pointer: coarse) {
    .chip { padding: 11px 16px; }
    textarea { height: 50px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<a href="#chat" class="skip-link">跳到对话内容</a>

<header>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.5"></circle>
      <polygon points="16.2 7.8 13.5 13.5 7.8 16.2 10.5 10.5 16.2 7.8"></polygon>
    </svg>
  </div>
  <div class="titles">
    <h1>AI 旅游规划助手</h1>
    <div class="sub">RAG 知识库 · 15 城攻略 · 真实票价 · 实时天气</div>
  </div>
  <div class="actions">
    <div class="status" role="status" aria-live="polite">
      <span class="dot" id="statusDot"></span><span id="statusText">连接中…</span>
    </div>
    <button class="icon-btn" id="newChatBtn" type="button" aria-label="开启新对话" title="开启新对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path>
      </svg>
    </button>
  </div>
</header>

<nav id="chips" aria-label="快捷提问"></nav>

<main id="chat" role="log" aria-live="polite" aria-relevant="additions" aria-label="对话内容"></main>

<footer>
  <div class="inputRow">
    <label class="sr-only" for="input">输入你的旅游需求</label>
    <div class="inputWrap">
      <textarea id="input" aria-label="输入你的旅游需求" placeholder="例如：帮我规划成都两日游，喜欢美食，预算 800 元（Enter 发送，Shift+Enter 换行）"></textarea>
    </div>
    <button id="sendBtn" type="button" aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
      </svg>
    </button>
  </div>
  <div class="hint">回答由小红书攻略语料 + 官方 AI 总结 + 真实门票/火车票价生成，供毕业设计演示</div>
</footer>

<script>
const API = "http://127.0.0.1:8291";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const newChatBtn = document.getElementById("newChatBtn");

let sessionId = localStorage.getItem("t_session");
if (!sessionId) {
  sessionId = "web-" + Date.now().toString(36);
  localStorage.setItem("t_session", sessionId);
}
const USER_ID = "u_web";

const ICON_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
const ICON_BOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"></path><path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"></path></svg>';
const ICON_CHIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path><circle cx="12" cy="12" r="4"></circle></svg>';

const chips = [
  "北京一日游怎么安排？带美食推荐",
  "成都两日游，爱吃辣，预算 800",
  "上海亲子两日游攻略",
  "西安三日游历史路线",
  "广州美食一日游",
  "杭州西湖周边一日游",
  "重庆两日游洪崖洞附近的行程",
  "长沙周末两天怎么玩",
];
const chipBar = document.getElementById("chips");
chips.forEach(t => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.innerHTML = ICON_CHIP + "<span>" + t + "</span>";
  b.onclick = () => { if (!sendBtn.disabled) { input.value = t; send(); } };
  chipBar.appendChild(b);
});

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function md(src) {
  const lines = esc(src).split("\n");
  let html = "", inUl = false, inTable = false;
  const closeUl = () => { if (inUl) { html += "</ul>"; inUl = false; } };
  const closeTable = () => { if (inTable) { html += "</tbody></table>"; inTable = false; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (/^\|.+\|$/.test(line)) {
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (/^[-: ]+$/.test(cells.join(""))) continue;
      if (!inTable) { html += "<table><tbody>"; inTable = true; }
      html += "<tr>" + cells.map(c => "<td>" + c + "</td>").join("") + "</tr>";
      continue;
    }
    closeTable();
    if (/^#{1,6}\s/.test(line)) { closeUl(); html += "<h3>" + line.replace(/^#+\s*/, "") + "</h3>"; continue; }
    if (/^####\s?/.test(line)) { html += "<h4>" + line.slice(5) + "</h4>"; continue; }
    const li = line.match(/^[-*•]\s+(.*)/);
    if (li) { if (!inUl) { html += "<ul>"; inUl = true; } html += "<li>" + li[1] + "</li>"; continue; }
    closeUl();
    if (!line) continue;
    html += "<div>" + line
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>") + "</div>";
  }
  closeUl(); closeTable();
  return html;
}

function addMsg(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML =
    '<div class="avatar" aria-hidden="true">' + (role === "user" ? ICON_USER : ICON_BOT) + '</div>' +
    '<div class="bubble"></div>';
  const bubble = wrap.querySelector(".bubble");
  if (text !== undefined) bubble.innerHTML = role === "user" ? esc(text).replace(/\n/g, "<br>") : md(text);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function health() {
  try {
    const r = await fetch(API + "/agent/health", { method: "GET" });
    if (r.ok) { statusDot.classList.add("on"); statusText.textContent = "服务在线"; return true; }
  } catch (e) {}
  statusDot.classList.remove("on"); statusText.textContent = "服务离线";
  return false;
}
health(); setInterval(health, 8000);

let busy = false;
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; input.value = "";
  addMsg("user", text);
  const bubble = addMsg("bot");
  bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';

  let acc = "", lastRender = 0;
  const render = (force) => {
    const now = Date.now();
    if (force || now - lastRender > 80) {
      bubble.innerHTML = md(acc);
      lastRender = now;
      chat.scrollTop = chat.scrollHeight;
    }
  };

  try {
    const resp = await fetch(API + "/agent/chat-stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, user_id: USER_ID, message: text }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          const tok = j.choices && j.choices[0] && j.choices[0].text;
          if (tok) { acc += tok; render(false); }
        } catch (e) {}
      }
    }
    if (!acc) acc = "（未收到回复，请确认服务是否正常）";
    render(true);
  } catch (e) {
    bubble.innerHTML = md("⚠️ 连接失败：" + e.message + "\n\n请确认服务已启动（端口 8291）。");
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

sendBtn.onclick = send;
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

newChatBtn.onclick = () => {
  sessionId = "web-" + Date.now().toString(36);
  localStorage.setItem("t_session", sessionId);
  chat.innerHTML = "";
  addMsg("bot",
    "已开启新对话。\n\n我是你的 AI 旅游规划助手，可以帮你：\n- **规划行程**：基于小红书 150+ 篇真实攻略与官方 AI 总结\n- **推荐美食**：按区域整理，含人均消费\n- **估算预算**：门票来自真实数据库、火车票来自 12306 实爬\n- **查询天气**：出行当天实时预报\n\n直接输入需求，或点上方快捷提问试试。");
};

addMsg("bot",
  "你好，我是你的 AI 旅游规划助手。\n\n我可以帮你：\n- **规划行程**：基于小红书 150+ 篇真实攻略与官方 AI 总结\n- **推荐美食**：按区域整理，含人均消费\n- **估算预算**：门票来自真实数据库、火车票来自 12306 实爬\n- **查询天气**：出行当天实时预报\n\n试试下面的快捷提问，或直接输入你的需求。");
input.focus();
</script>
</body>
</html>

# 测试环境配置（仅 src/test 生效，不进入生产包）
#
# 注意：Spring Boot 中 test classpath 的 application.yml 会完全覆盖主配置（非合并），
# 因此 datasource / mybatis / redis 等基础项需在此显式声明。
#
# 背景：主配置的大模型 Key 使用 ${ZHIPU_API_KEY} 占位符（密钥不入库，
# 由部署环境注入）。单元测试环境没有该环境变量，Spring 上下文加载时占位符解析失败。
# 这里提供占位值，保证 AiTourismApplicationTests.contextLoads 可在任何机器上运行；
# 真实 LLM 调用由 PlanningContextParseTest / 其他单元测试以 mock/静态输入方式覆盖，
# 不依赖网络。
openai:
  api-key: "test-placeholder-key"
  base-url: "https://open.bigmodel.cn/api/paas/v4"
  model-name: "glm-4-flash"
  max-output-tokens: 2000

# 小模型（会话标题生成），与主配置同结构
openai-small:
  api-key: "test-placeholder-key"
  base-url: "https://open.bigmodel.cn/api/paas/v4"
  model-name: "glm-4-flash"
  max-output-tokens: 200

# 测试环境不发起真实外部调用（无有效 Key 时系统自动降级估算，行为与生产一致）
amap:
  web-api-key: "test-placeholder-key"

price:
  train:
    provider: ""
    api-key: ""
    api-url: ""
    cache-hours: 24

# 数据源与主配置同口径（本地开发库；contextLoads 仅验证 Bean 装配，不访问数据）
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/aitourism?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 不可用时聊天记忆自动降级 MySQL（与生产行为一致）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
